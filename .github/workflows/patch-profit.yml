name: Patch profit wallet (one-time)
on:
  push:
    branches: [fix/gasless-service-relayer]
    paths: [scripts/patch-profit-wallet.py, .github/workflows/patch-profit.yml, supabase/functions/_shared/profit-wallet.ts]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gasless-service-relayer
      - run: python3 scripts/patch-profit-wallet.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/execute-flash-loan/index.ts
          if git diff --cached --quiet; then echo no-change; else git commit -m "feat(profit): enforce PROFIT_WALLET in execute-flash-loan" && git push; fi
