name: Patch scanner auto-execute (one-time)
on:
  push:
    branches: [fix/gasless-service-relayer]
    paths: [scripts/patch-gasless-scanner.py, .github/workflows/patch-scanner.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gasless-service-relayer
      - run: python3 scripts/patch-gasless-scanner.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/scan-opportunities/index.ts
          if git diff --cached --quiet; then echo no-change; else git commit -m "fix(gasless): fail-close scanner Gelato auto-execute" && git push; fi
