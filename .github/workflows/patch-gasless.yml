name: Patch gasless config (one-time)
on:
  push:
    branches: [fix/gasless-service-relayer]
    paths: [scripts/patch-gasless-config.py, .github/workflows/patch-gasless.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gasless-service-relayer
      - run: python3 scripts/patch-gasless-config.py
      - name: Commit patched configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/mainnet-config.ts supabase/functions/_shared/contract-addresses.ts contracts/GaslessRelayer.sol contracts/scripts/config.ts || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "fix(gasless): zero legacy executor/relayer defaults, remove third-party paymasters" && git push; fi
