name: Deploy submarine app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - name: Build
        env:
          VITE_SUPABASE_URL: https://iaqzemamxjpdqvxcreil.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2iPiPUzsGJNy8I3Ln_iPnQ_-uvq8NeT
          VITE_BASE: /submarine-arbitrage-engine/
        run: npm run build
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: submarine-dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
